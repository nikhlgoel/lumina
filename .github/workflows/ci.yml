name: CI

# What every push to main and every pull request is checked against: the types, the unit tests (including the property tests), the production build, and that the
# browser extension still packages. The tests that drive the real app and a real browser (scripts/release-check.sh) need the bundled tools and a desktop, so they
# are run by the person releasing, not here.
#
# NOTE: this workflow has not yet run on GitHub. It runs the same commands as the local checks, on the same operating system the app is built for.

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Unit and property tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: The browser extension packages
        run: node scripts/build-extension.mjs

  # Known security problems in what ships. Separate and allowed to fail: an advisory published tomorrow is not a reason to block today's pull request,
  # but it should be seen.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm audit --prod
