    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    />
    <script>
      // Lumina 2.0 Mobile Bridge Polyfill for Android (API 30+)
      if (!window.luminaAPI) {
        window.luminaAPI = {
          getSettings: async () => ({
            theme: 'onyx',
            colorMode: 'dark',
            ambientShader: true,
            blurIntensity: 20,
            defaultVideoRes: '1080p',
            defaultAudioFormat: 'mp3',
            autoSaveToUsb: false,
            usbFolderName: 'LuminaMedia',
            internalVideoPath: '/storage/emulated/0/Movies/Lumina',
            internalMusicPath: '/storage/emulated/0/Music/Lumina',
            internalDownloadPath: '/storage/emulated/0/Download/Lumina',
            maxConcurrentDownloads: 3,
            batchConcurrency: 3,
            speedLimit: 0,
            browserForCookies: 'none',
            turboConnections: 16,
            enableTurboMode: true,
            enableBitTorrent: true,
            anonymizeRequests: true
          }),
          saveSettings: async (s) => s,
          getStorageDrives: async () => ([
            { id: 'internal', name: 'Internal Storage', label: 'Android Phone Storage', mountpoint: '/storage/emulated/0/Download/Lumina', totalSpace: '128 GB', freeSpace: '64 GB', freeBytes: 68719476736, isRemovable: false }
          ]),
          searchMusic: async (query) => {
            try {
              const res = await fetch('https://lrclib.net/api/search?q=' + encodeURIComponent(query));
              const data = await res.json();
              if (Array.isArray(data)) {
                return data.slice(0, 15).map((d) => ({
                  id: String(d.id),
                  title: d.trackName,
                  artist: d.artistName,
                  duration: Math.floor(d.duration / 60) + ':' + (Math.floor(d.duration % 60) < 10 ? '0' : '') + Math.floor(d.duration % 60),
                  thumbnail: '',
                  url: 'https://lrclib.net/api/get/' + d.id
                }));
              }
            } catch (e) {}
            return [];
          },
          getStreamUrl: async (id) => id,
          getLyrics: async (query) => {
            try {
              const res = await fetch('https://lrclib.net/api/search?q=' + encodeURIComponent((query.title || '') + ' ' + (query.artist || '')));
              const data = await res.json();
              if (Array.isArray(data) && data[0]) {
                const item = data[0];
                const lines = (item.syncedLyrics || '').split('\n').map(l => {
                  const m = l.match(/^\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\](.*)$/);
                  if (!m) return null;
                  const minutes = parseInt(m[1], 10);
                  const seconds = parseInt(m[2], 10);
                  let ms = 0;
                  if (m[3]) ms = parseInt(m[3].padEnd(3, '0').slice(0, 3), 10);
                  return { time: minutes * 60 + seconds + ms / 1000, text: m[4].trim() };
                }).filter(Boolean);
                return {
                  trackName: item.trackName,
                  artistName: item.artistName,
                  plainLyrics: item.plainLyrics,
                  syncedLyrics: item.syncedLyrics,
                  lines: lines.length > 0 ? lines : (item.plainLyrics || '').split('\n').map(t => ({ time: -1, text: t.trim() })).filter(l => l.text),
                  isSynced: lines.length > 0,
                  source: 'lrclib'
                };
              }
            } catch (e) {}
            return null;
          },
          crawlMultiLinks: async (rawText) => {
            const urlMatches = rawText.match(/(https?:\/\/[^\s"'<>()]+|magnet:\?[^\s"'<>]+)/gi) || [];
            const urls = Array.from(new Set(urlMatches.map(u => u.replace(/[.,;:)\]>]+$/, '').trim()))).filter(Boolean);
            
            const parts = urls.map((url, idx) => {
              let filename = 'download_file';
              try {
                const parsed = new URL(url);
                filename = parsed.pathname.split('/').pop() || 'file_' + (idx + 1);
              } catch (_) {}
              
              const partMatch = filename.match(/[-_.]?part[-_.]?(\d+)/i) || filename.match(/setup[-_.]?(\d+)/i) || filename.match(/fg[-_.]?(\d+)/i);
              const partIndex = partMatch ? parseInt(partMatch[1], 10) : idx + 1;
              const isPlayable = /\.(mp4|mkv|webm|avi|mov|mp3|flac|wav|m4a)$/i.test(filename);
              
              return {
                partIndex,
                rawUrl: url,
                directUrl: url,
                filename,
                extension: '.' + (filename.split('.').pop() || 'bin'),
                hostName: url.includes('pixeldrain') ? 'Pixeldrain' : url.includes('mediafire') ? 'Mediafire' : 'Direct Link',
                sizeBytes: 524288000,
                sizeStr: '500 MB',
                status: 'ready',
                isPlayable,
                streamUrl: isPlayable ? url : undefined
              };
            });

            parts.sort((a, b) => a.partIndex - b.partIndex);
            const missingParts = [];
            const maxPart = parts.length > 0 ? Math.max(...parts.map(p => p.partIndex)) : 0;
            const existing = new Set(parts.map(p => p.partIndex));
            if (maxPart > parts.length) {
              for (let i = 1; i <= maxPart; i++) {
                if (!existing.has(i)) missingParts.push(i);
              }
            }

            return {
              id: 'repack_' + Date.now(),
              title: parts[0]?.filename?.replace(/[-_.]?part.*$/i, '') || 'Android Repack Package',
              totalPartsExpected: maxPart || parts.length,
              partsDiscoveredCount: parts.length,
              missingParts,
              isComplete: missingParts.length === 0,
              totalSizeBytes: parts.length * 524288000,
              totalSizeStr: (parts.length * 0.5).toFixed(1) + ' GB',
              parts,
              standaloneFiles: [],
              detectedHost: 'Multi-Source Acceleration',
              hasPlayableMedia: parts.some(p => p.isPlayable)
            };
          },
          startRepackDownload: async (pkg) => {
            if (window.LuminaAndroidBridge) {
              window.LuminaAndroidBridge.postMessage(JSON.stringify({ type: 'repack_download', title: pkg.title, count: pkg.parts.length }));
            }
            return pkg.parts.map((_, i) => 'repack_task_' + i);
          },
          resolveDirectLink: async (url) => ({
            directUrl: url,
            filename: 'download_file',
            sizeBytes: 0,
            sizeStr: 'Direct Stream'
          }),
          inspectUrl: async (url) => ({
            id: 'm_' + Date.now(),
            url,
            title: url.slice(0, 40),
            thumbnail: '',
            duration: 180,
            durationStr: '3:00',
            uploader: 'Mobile Ingestion',
            viewCount: 1,
            isLive: false,
            formats: [],
            audioFormats: [
              { format: 'mp3', label: 'MP3 Lossless (320kbps)', bitrate: '320k' },
              { format: 'flac', label: 'FLAC Studio Quality', bitrate: 'Lossless' }
            ],
            subtitles: []
          }),
          startDownload: async (req) => {
            if (window.LuminaAndroidBridge) {
              window.LuminaAndroidBridge.postMessage(JSON.stringify({ type: 'download', url: req.url, title: req.title }));
            }
            return 'mobile_download_' + Date.now();
          },
          pauseDownload: async () => true,
          resumeDownload: async () => true,
          cancelDownload: async () => true,
          getDownloadedMedia: async () => ({ videos: [], music: [] }),
          openFile: async () => {},
          openDirectory: async () => {},
          selectDirectory: async () => null,
          selectTorrentFile: async () => null,
          minimizeWindow: () => {},
          maximizeWindow: () => {},
          closeWindow: () => {},
          isMaximized: async () => false,
          onDownloadProgress: () => () => {},
          onDrivesChanged: () => () => {}
        };
      }
    </script>
