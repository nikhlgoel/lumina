<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Lumina crystal: the original hexagonal prism, re-cut in the app's amber/copper palette.
       Hexagon centre (512,492), radius 420. Inner hexagram points a–f sit at radius 242.5. -->
  <defs>
    <linearGradient id="faceTop" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFE9C9"/>
      <stop offset="0.5" stop-color="#FFBE7A"/>
      <stop offset="1" stop-color="#F59A4E"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#F7A45C"/>
      <stop offset="0.6" stop-color="#E4712C"/>
      <stop offset="1" stop-color="#C4531B"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#D86A2A"/>
      <stop offset="0.55" stop-color="#A9441A"/>
      <stop offset="1" stop-color="#7A2E12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFD2A0" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.4" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#FFF8EE" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#FFD3A1" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#E9793A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#B84C1A" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE0BC"/>
    </linearGradient>
    <radialGradient id="reflect" cx="512" cy="952" r="330" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 952) scale(1 0.16) translate(0 -952)">
      <stop offset="0" stop-color="#F08A3E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F08A3E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0.1" y1="0.05" x2="0.75" y2="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.39" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Floor glow -->
  <ellipse cx="512" cy="952" rx="330" ry="54" fill="url(#reflect)"/>

  <!-- Cube faces -->
  <polygon points="512,72 876,282 512,492 148,282" fill="url(#faceTop)"/>
  <polygon points="148,282 512,492 512,912 148,702" fill="url(#faceLeft)"/>
  <polygon points="876,282 876,702 512,912 512,492" fill="url(#faceRight)"/>

  <!-- Facets: alternating light and shade give the glass its refraction -->
  <g>
    <polygon points="512,72 876,282 633.3,282" fill="#FFF3E0" opacity="0.38"/>
    <polygon points="876,282 876,702 754.5,492" fill="#FFC58A" opacity="0.30"/>
    <polygon points="876,702 512,912 633.3,702" fill="#5C200B" opacity="0.30"/>
    <polygon points="512,912 148,702 390.7,702" fill="#FFB36B" opacity="0.28"/>
    <polygon points="148,702 148,282 269.5,492" fill="#7E2F12" opacity="0.22"/>
    <polygon points="148,282 512,72 390.7,282" fill="#FFFFFF" opacity="0.30"/>

    <polygon points="512,72 633.3,282 390.7,282" fill="#FFFFFF" opacity="0.16"/>
    <polygon points="876,282 754.5,492 633.3,282" fill="#FFE2BD" opacity="0.22"/>
    <polygon points="876,702 633.3,702 754.5,492" fill="#4A1A08" opacity="0.26"/>
    <polygon points="512,912 390.7,702 633.3,702" fill="#FF9A52" opacity="0.30"/>
    <polygon points="148,702 269.5,492 390.7,702" fill="#FFD6A8" opacity="0.20"/>
    <polygon points="148,282 390.7,282 269.5,492" fill="#FFEAD0" opacity="0.28"/>

    <polygon points="633.3,282 754.5,492 633.3,702 390.7,702 269.5,492 390.7,282" fill="#2A1208" opacity="0.18"/>
  </g>

  <!-- Glass sheen sweeping in from the upper left -->
  <polygon points="512,72 876,282 876,702 512,912 148,702 148,282" fill="url(#sheen)"/>

  <!-- Hexagram and cube edges -->
  <g fill="none" stroke="url(#edge)" stroke-linejoin="round">
    <polygon points="512,72 876,702 148,702" stroke-width="5"/>
    <polygon points="512,912 148,282 876,282" stroke-width="5"/>
    <path d="M512 492 L512 72 M512 492 L876 702 M512 492 L148 702" stroke-width="4" opacity="0.6"/>
    <polygon points="512,72 876,282 876,702 512,912 148,702 148,282" stroke-width="10"/>
  </g>

  <!-- Glass orb with the play mark -->
  <circle cx="512" cy="496" r="178" fill="#3A1709" opacity="0.35" filter="url(#soft)"/>
  <circle cx="512" cy="492" r="172" fill="url(#orb)"/>
  <circle cx="512" cy="492" r="172" fill="none" stroke="#FFF2DF" stroke-opacity="0.75" stroke-width="5"/>
  <path d="M478 420 C478 406 492 398 504 405 L602 466 C613 473 613 488 602 495 L504 556 C492 563 478 555 478 541 Z" fill="url(#play)" opacity="0.93"/>
  <ellipse cx="452" cy="398" rx="70" ry="34" transform="rotate(-32 452 398)" fill="#FFFFFF" opacity="0.55"/>
</svg>
